<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Formula 1: Grammar & Vocabulary Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-color: #f7f9fa;
    --card-bg: #ffffff;
    --text-dark: #3c3c3c;
    --text-muted: #afafaf;
    --primary-color: #58cc02;
    --primary-dark: #46a302;
    --warning-color: #f39c12;
    --border-color: #e5e5e5;
    --font-heading: 'Fredoka', sans-serif;
    --font-body: 'Quicksand', sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: var(--font-body);
    background-color: var(--bg-color);
    color: var(--text-dark);
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px 10px;
  }

  .quiz-wrapper {
    background: var(--card-bg);
    width: 100%;
    max-width: 650px;
    border: 2px solid var(--border-color);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 8px 0 var(--border-color);
    margin-top: 15px;
    position: relative;
  }

  .quiz-header {
    display: flex;
    align-items: center;
    gap: 15px;
    margin-bottom: 25px;
  }

  .progress-track {
    flex-grow: 1;
    height: 16px;
    background-color: var(--border-color);
    border-radius: 10px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background-color: var(--primary-color);
    border-radius: 10px;
    transition: width 0.3s ease;
  }

  .counter-display {
    font-family: var(--font-heading);
    font-weight: 700;
    color: var(--text-muted);
    font-size: 1rem;
  }

  .screen {
    display: none;
    animation: slideUpFade 0.4s ease forwards;
  }

  .screen.active {
    display: block;
  }

  @keyframes slideUpFade {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .hint-box {
    background: #e1f5fe;
    border: 2px solid #b3e5fc;
    padding: 14px 18px;
    border-radius: 14px;
    margin-bottom: 20px;
    font-size: 1.05rem;
    font-weight: 700;
    color: #0288d1;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .image-container {
    width: 100%;
    height: 200px;
    margin-bottom: 20px;
    border-radius: 14px;
    border: 2px solid var(--border-color);
    overflow: hidden;
    background: #f1f5f9;
  }

  .image-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .question-sentence {
    font-family: var(--font-heading);
    font-size: 1.35rem;
    font-weight: 700;
    line-height: 1.4;
    margin-bottom: 25px;
    color: var(--text-dark);
    text-align: left;
  }

  .blank-space {
    display: inline-block;
    min-width: 90px;
    border-bottom: 3px dashed var(--text-dark);
    text-align: center;
    color: var(--primary-color);
    padding: 0 4px;
  }

  .options-stack {
    display: grid;
    grid-template-columns: 1fr;
    gap: 14px;
    margin-bottom: 5px;
  }

  .option-btn {
    background: var(--card-bg);
    border: 2px solid var(--border-color);
    border-bottom: 4px solid var(--border-color);
    border-radius: 14px;
    padding: 16px 20px;
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--text-dark);
    text-align: left;
    cursor: pointer;
    transition: background-color 0.1s, transform 0.1s;
    user-select: none;
    outline: none;
  }

  .option-btn:active {
    transform: translateY(2px);
    border-bottom-width: 2px;
  }

  .option-btn.state-correct {
    background-color: #d7ffb8 !important;
    border-color: var(--primary-color) !important;
    border-bottom-color: var(--primary-dark) !important;
    color: #527e02 !important;
  }

  .option-btn.state-incorrect {
    background-color: #fff3cd !important;
    border-color: var(--warning-color) !important;
    border-bottom-color: #b45309 !important;
    color: #b45309 !important;
  }

  .finish-layout {
    text-align: center;
    padding: 15px 0;
  }

  .award-icon {
    font-size: 5.5rem;
    margin-bottom: 15px;
    animation: scalePop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  @keyframes scalePop {
    from { transform: scale(0.5); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .finish-title {
    font-family: var(--font-heading);
    font-size: 2rem;
    font-weight: 700;
    color: #ffc800;
    margin-bottom: 12px;
    text-shadow: 0 2px 0 #e6b400;
  }

  .finish-score {
    font-size: 1.3rem;
    font-weight: 700;
    color: #666;
    margin-bottom: 35px;
  }

  .success-msg {
    color: var(--primary-dark);
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 25px;
    display: none;
    background: #d7ffb8;
    padding: 12px;
    border-radius: 8px;
    border: 2px solid var(--primary-color);
  }

  .action-trigger {
    width: 100%;
    background-color: var(--primary-color);
    border: none;
    border-bottom: 4px solid var(--primary-dark);
    border-radius: 14px;
    color: white;
    padding: 16px;
    font-size: 1.2rem;
    font-weight: 700;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.8px;
  }

  .action-trigger:active {
    transform: translateY(2px);
    border-bottom-width: 2px;
  }

  @media (max-width: 480px) {
    body { padding: 10px 5px; }
    .quiz-wrapper { border-radius: 16px; padding: 18px; }
    .question-sentence { font-size: 1.15rem; }
    .option-btn { font-size: 1.05rem; padding: 14px; }
    .image-container { height: 150px; }
  }
</style>
</head>
<body>

<div class="quiz-wrapper" id="masterContainer">
  <div class="quiz-header" id="trackerHeader">
    <div class="progress-track">
      <div class="progress-fill" id="statusBar"></div>
    </div>
    <div class="counter-display" id="indexCounter">1/8</div>
  </div>

  <div class="screen active" id="gameboard">
    <div class="hint-box">
      <span>💡</span>
      <span id="translationHint">Choose the correct option for the sentence.</span>
    </div>
    <div class="image-container" id="imageBox">
      <img src="" id="taskImage" alt="Context Image">
    </div>
    <div class="question-sentence" id="sentencePrompt">
      Loading item...
    </div>
    <div class="options-stack" id="buttonGrid"></div>
  </div>

  <div class="screen" id="summaryBoard">
    <div class="finish-layout">
      <div class="award-icon" id="badgeIcon">🏆</div>
      <div class="finish-title" id="performanceTitle">Quiz Complete!</div>
      <div class="finish-score" id="scoreOverview">Your score: 0/8</div>
      <p class="success-msg" id="success-msg">Results sent successfully! ✅</p>
      <button class="action-trigger" id="resetAction">Start Again</button>
    </div>
  </div>
</div>

<script>
  // ================================================================
  //  CONFIGURATION & RESULTS TRACKING
  // ================================================================
  const TEST_NAME = "Formula 1 Grammar & Vocabulary Challenge";
  let userMistakes = [];
  let currentStep = 0;
  let score = 0;
  let inputLocked = false;

  // Data adapted from the grammar rules and Formula 1 context in the photos
  const quizData = [
    { 
      hint: "Choose the correct adjective.", 
      img: "https://avatars.mds.yandex.net/i?id=07c58f89d7c5881eba16c3acc7913bf8_l-5875681-images-thumbs&n=13",
      en: "The new racing suit is very good, so it is very <span class='blank-space'>______</span> to wear.", 
      correct: "comfortable", 
      pool: ["heavy", "boring", "slow"] 
    },
    { 
      hint: "Choose the correct adjective.", 
      img: "https://www.hi-fi.ru/upload/medialibrary/cc8/jojjqkrr0wt3v2t10kdi1ldmcs674qlz.jpg",
      en: "They always watch a sports channel in the garage. It's really interesting, it's not <span class='blank-space'>______</span>.", 
      correct: "boring", 
      pool: ["exciting", "funny", "loud"] 
    },
    { 
      hint: "Choose the correct auxiliary verb.", 
      img: "https://www.racefans.net/wp-content/uploads/2025/12/racefansdotnet-24-12-07-13-24-44-6-SI202512070158.jpg",
      en: "During the race, drivers <span class='blank-space'>______</span> use their mobile phones.", 
      correct: "don't", 
      pool: ["doesn't", "isn't", "aren't"] 
    },
    { 
      hint: "Choose the correct auxiliary verb.", 
      img: "https://i.pinimg.com/originals/e3/ea/cf/e3eacf4be53d8957d799fd0518db7f5f.jpg",
      en: "What time <span class='blank-space'>______</span> the driver leave for the track in the morning?", 
      correct: "does", 
      pool: ["do", "is", "are"] 
    },
    { 
      hint: "Choose the correct preposition of time.", 
      img: "https://static.vecteezy.com/system/resources/previews/032/048/651/non_2x/digital-clock-time-at-2-00-am-digital-clock-12-hour-format-free-png.png",
      en: "The race starts <span class='blank-space'>______</span> 2 pm.", 
      correct: "at", 
      pool: ["on", "in", "by"] 
    },
    { 
      hint: "Choose the correct verb form.", 
      img: "https://photobooth.cdn.sports.ru/preset/post/e/e6/b41ce27c8404a8aafdca80764f28f.jpeg?f=webp&q=90&s=2x&w=730",
      en: "The mechanic <span class='blank-space'>______</span> the car on Saturday during the pit stop.", 
      correct: "checks", 
      pool: ["check", "checking", "checked"] 
    },
    { 
      hint: "Choose the correct negative form.", 
      img: "https://formula1.wordpress.com/wp-content/uploads/2016/04/season2016_race4_wednesday_5.jpg",
      en: "The driver <span class='blank-space'>______</span> stand on the podium on Sunday evening if he doesn't win.", 
      correct: "doesn't", 
      pool: ["don't", "isn't", "aren't"] 
    },
    { 
      hint: "Choose the correct sequence word.", 
      img: "https://yandex-images.clstorage.net/v4uwN7285/01649eRHo2/y939mLNZaop3sXbru4lC07XueyNIOmEIm7d-JSzAVwnda1ZC7Iwe_makvhMJqNRznPegMdDjcA8gI6KiYV43Z9-OvNTwGnDWJvJoo_eOS9eqpWZrSH19WpCgZSBwgQ9fhjkGKtKsO4oK39Rte9n4bpvgsHXp2mEcVjfl9WoxOhLWxdqprWAIpGKAEdq4hV_Mg7NUIkhna3O2nxQJbqR1a-NKQhD7qQmeGsjidUz3_UOSqJdmwcI3Ckkw5uFoMi04zsrsg4hiJbZCgyLnrYN18bWjexNpU3J9h5chMne4ZWfBQ08WxKQgqTv26EJsyd5FjY-vePrUBARpJPHmdw4zBvHI552STjGOS6oS9J6qT-Cir2cLSEBPUbi5MANLuW5E2HJ6F9m5FaIU6NNLWubaWoy_gGL75jUNfBHi0EoBMhvUxvO9j281kFKTL_Gsskjdi41bBEV2UWWGgAQbTKVAd-1DZxD-lQmbAd_rXmXA4GW1iaxB9_AsMnIP-NlLEjIF-MbgroxnHqRalSHRs65H2I-FUzZFXWZmq6EhFXugckXjRn0_1ZUemxrp6FZv-eROu7-Kd8fkKDh5COr4ST0QJsTX7KyMeAeCf4sK172IV8efoU8xSFp5drSlJzB8v1B2wVF5PMSeEo4l3stxfsXTTZKIim_X4yMjWzjH3Hw8OgPKzMeQqHojt3uFO8WKjWf4rpFzHFtlcnWlthQQUrBNYvNrYxfohCqPL_vKXnrZxHCzgotZ9_MqM1oh8tBoPwEB1d7flLdDKapAkD72qrVE-aOEUyN9YXFklZcSI2yGUHfrW10XzJ0xviLe6UF149tQsYWvZt_RAiBSKtraSygTLtHT562jaQeuR7gQx7mCbcaBhnc2U1xhQ5WaCxBygltezUNwH-WgFZIR3_x-XfjHXamqoEHA8AcuWzX0-F8kFzrx3uuwkEw1rVWQKPCJrX7_opFBIkVQQVC6ty4ue7Y",
      en: "In the evening, he usually watches TV <span class='blank-space'>______</span> he goes to bed.", 
      correct: "before", 
      pool: ["then", "after", "when"] 
    }
  ];

  // ================================================================
  //  GAME LOGIC
  // ================================================================
  function initGame() {
    currentStep = 0;
    score = 0;
    inputLocked = false;
    userMistakes = [];
    document.getElementById('gameboard').classList.add('active');
    document.getElementById('summaryBoard').classList.remove('active');
    document.getElementById('trackerHeader').style.display = 'flex';
    document.getElementById('success-msg').style.display = 'none';
    loadTask();
  }

  function loadTask() {
    if (currentStep >= quizData.length) {
      showResults();
      return;
    }

    inputLocked = false;
    const task = quizData[currentStep];

    document.getElementById('indexCounter').innerText = `${currentStep + 1}/${quizData.length}`;
    const percent = (currentStep / quizData.length) * 100;
    document.getElementById('statusBar').style.width = `${percent}%`;

    document.getElementById('translationHint').innerText = task.hint;
    document.getElementById('sentencePrompt').innerHTML = task.en;
    
    // Load the image
    document.getElementById('taskImage').src = task.img;

    const allOptions = [task.correct, ...task.pool].sort(() => Math.random() - 0.5);
    const grid = document.getElementById('buttonGrid');
    grid.innerHTML = '';
    allOptions.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'option-btn';
      btn.innerText = opt;
      btn.addEventListener('click', () => checkAnswer(opt, btn));
      grid.appendChild(btn);
    });
  }

  function checkAnswer(selectedText, btn) {
    if (inputLocked) return;
    inputLocked = true;

    const task = quizData[currentStep];
    const correct = task.correct;
    const allBtns = document.querySelectorAll('#buttonGrid .option-btn');
    allBtns.forEach(b => b.disabled = true);

    const isCorrect = selectedText === correct;
    if (isCorrect) {
      btn.classList.add('state-correct');
      score++;
    } else {
      btn.classList.add('state-incorrect');
      
      // MANDATORY: Track the wrong word every time
      userMistakes.push(selectedText);

      allBtns.forEach(b => {
        if (b.innerText === correct) b.classList.add('state-correct');
      });
    }

    document.getElementById('statusBar').style.width = `${((currentStep + 1) / quizData.length) * 100}%`;

    setTimeout(() => {
      currentStep++;
      loadTask();
    }, 1500);
  }

  // ================================================================
  //  RESULTS & GOOGLE SHEETS
  // ================================================================
  function showResults() {
    document.getElementById('gameboard').classList.remove('active');
    document.getElementById('summaryBoard').classList.add('active');
    document.getElementById('statusBar').style.width = '100%';
    document.getElementById('scoreOverview').innerText = `Your score: ${score}/${quizData.length}`;

    let title = 'Quiz Complete!';
    let icon = '🏆';
    if (score === quizData.length) {
      title = 'Perfect Score! 👑';
      icon = '🏁';
    } else if (score >= 5) {
      title = 'Great Effort! 🏎️';
      icon = '🏅';
    } else {
      title = 'Keep Practicing! 🔧';
      icon = '⚙️';
    }
    document.getElementById('performanceTitle').innerText = title;
    document.getElementById('badgeIcon').innerText = icon;

    sendResultsToGoogle();
  }

  // ========== MANDATORY GOOGLE SHEETS SENDING FUNCTION ==========
  async function sendResultsToGoogle() {
    const url = "https://script.google.com/macros/s/AKfycbxZDFh5oa4GAU6RMvWX_OIh0GeLTbolr7P-6cCtbCNT5qiTShRaCYlETAxewsLsnooK/exec";
    
    const params = new URLSearchParams({
      name: TEST_NAME,
      score: score,
      total: quizData.length,
      mistakes: userMistakes.join(', ')
    });

    try {
      await fetch(url, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params.toString()
      });
      
      // Display the required success message in green
      const msgEl = document.getElementById('success-msg');
      if (msgEl) msgEl.style.display = 'block';
    } catch (error) {
      console.error("Error sending results:", error);
    }
  }

  document.getElementById('resetAction').addEventListener('click', initGame);
  window.addEventListener('DOMContentLoaded', initGame);
</script>

</body>
</html>
