<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotlight 5: Unit 6 Interactive Quiz</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --accent: #ff7675;
            --success: #00b894;
            --bg: #f0f2f5;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; }
        .quiz-card { background: white; width: 100%; max-width: 600px; border-radius: 25px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); }
        
        .grammar-tag {
            display: inline-block;
            font-size: 12px;
            font-weight: bold;
            color: #6c5ce7;
            background: #f0edff;
            padding: 4px 10px;
            border-radius: 12px;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .progress-bar { height: 10px; background: #eee; border-radius: 5px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--primary); width: 0%; transition: 0.4s; }
        
        .q-text { font-size: 20px; margin-bottom: 25px; line-height: 1.6; color: #2d3436; }
        
        .options { display: grid; gap: 12px; }
        .option-btn { 
            padding: 15px; border: 2px solid #e0e0e0; border-radius: 15px; 
            background: white; cursor: pointer; font-size: 17px; transition: 0.2s; text-align: left;
            font-family: inherit; color: #2d3436;
        }
        .option-btn:hover { border-color: var(--primary); background: #f8f7ff; }
        .option-btn.correct { background: var(--success) !important; color: white; border-color: var(--success); }
        .option-btn.wrong { background: var(--accent) !important; color: white; border-color: var(--accent); }
        
        #result-area { text-align: center; display: none; padding: 20px 0; }
        .score-val { font-size: 64px; font-weight: bold; color: var(--primary); margin-bottom: 10px; }
        
        .success-msg {
            display: none;
            color: #00b894;
            font-weight: bold;
            font-size: 18px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    
    <div id="quiz-body"></div>
    
    <div id="result-area">
        <h2>Quiz Results</h2>
        <div class="score-val" id="final-score">0/12</div>
        <button onclick="location.reload()" style="padding:12px 30px; border-radius:12px; border:none; background:var(--primary); color:white; font-size: 16px; cursor:pointer; font-weight: bold;">Restart Quiz</button>
        <div class="success-msg" id="success-msg">Results sent successfully! ✅</div>
    </div>
</div>

<script>
    // --- CONFIGURATION & RESULTS TRACKING ---
    const TEST_NAME = "Spotlight 5: Who's/Whose & Missing Words - 12 Questions";
    let userMistakes = [];
    let score = 0;
    let currentQ = 0;

    // 12 Questions based on the images
    const questions = [
        // Who's vs Whose
        { 
            tag: "Who's or Whose?",
            q: "___ joining us for dinner tonight?", 
            a: ["Who's", "Whose", "Who"], 
            c: 0 
        },
        { 
            tag: "Who's or Whose?",
            q: "___ phone is ringing on the table?", 
            a: ["Who's", "Whose", "Who"], 
            c: 1 
        },
        { 
            tag: "Who's or Whose?",
            q: "___ the person you were talking to?", 
            a: ["Whose", "Who", "Who's"], 
            c: 2 
        },
        { 
            tag: "Who's or Whose?",
            q: "Do you know ___ pen this is?", 
            a: ["whose", "who's", "who"], 
            c: 0 
        },
        { 
            tag: "Who's or Whose?",
            q: "___ car is parked outside the garage?", 
            a: ["Who's", "Whose", "Who"], 
            c: 1 
        },
        { 
            tag: "Who's or Whose?",
            q: "___ coming to the party tomorrow?", 
            a: ["Whose", "Who", "Who's"], 
            c: 2 
        },
        // Missing Words
        { 
            tag: "Missing Word",
            q: "What ___ you usually do on weekends?", 
            a: ["do", "does", "did"], 
            c: 0 
        },
        { 
            tag: "Missing Word",
            q: "Where ___ you going right now?", 
            a: ["is", "are", "do"], 
            c: 1 
        },
        { 
            tag: "Missing Word",
            q: "What kind ___ music do you listen to?", 
            a: ["to", "of", "from"], 
            c: 1 
        },
        { 
            tag: "Missing Word",
            q: "How many languages ___ your sister speak?", 
            a: ["do", "does", "is"], 
            c: 1 
        },
        { 
            tag: "Missing Word",
            q: "What time ___ the train leave?", 
            a: ["does", "do", "is"], 
            c: 0 
        },
        { 
            tag: "Missing Word",
            q: "Why ___ you crying yesterday?", 
            a: ["was", "were", "did"], 
            c: 1 
        }
    ];

    function loadQuestion() {
        const q = questions[currentQ];
        
        // Update progress bar
        document.getElementById('progress').style.width = (currentQ / questions.length) * 100 + "%";
        
        // Render question
        document.getElementById('quiz-body').innerHTML = `
            <div class="grammar-tag">${q.tag}</div>
            <div class="q-text">${q.q}</div>
            <div class="options">
                ${q.a.map((opt, i) => `<button class="option-btn" onclick="check(${i})">${opt}</button>`).join('')}
            </div>
        `;
    }

    function check(idx) {
        const btns = document.querySelectorAll('.option-btn');
        
        if (idx === questions[currentQ].c) { 
            btns[idx].classList.add('correct'); 
            score++; 
        } else { 
            btns[idx].classList.add('wrong'); 
            // Track mistake (push the text of the wrong option)
            userMistakes.push(btns[idx].innerText); 
            btns[questions[currentQ].c].classList.add('correct'); 
        }
        
        // Disable all buttons to prevent multiple clicks
        btns.forEach(b => b.style.pointerEvents = 'none');
        
        // Move to next question after 1.2 seconds
        setTimeout(() => {
            currentQ++;
            if (currentQ < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }, 1200);
    }

    function showResult() {
        document.getElementById('progress').style.width = "100%";
        document.getElementById('quiz-body').style.display = 'none';
        document.getElementById('result-area').style.display = 'block';
        document.getElementById('final-score').innerText = `${score}/${questions.length}`;
        
        // Send to Google Sheets
        sendResultsToGoogle();
    }

    // ================================================================
    //  GOOGLE SHEETS INTEGRATION (MANDATORY)
    // ================================================================
    function sendResultsToGoogle() {
        const url = "https://script.google.com/macros/s/AKfycbxZDFh5oa4GAU6RMvWX_OIh0GeLTbolr7P-6cCtbCNT5qiTShRaCYlETAxewsLsnooK/exec";
        
        const params = new URLSearchParams();
        params.append('name', TEST_NAME);
        params.append('score', score);
        params.append('total', questions.length);
        params.append('mistakes', userMistakes.join(', '));

        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: params.toString()
        })
        .then(() => {
            document.getElementById('success-msg').style.display = 'block';
        })
        .catch(error => {
            console.error('Error sending results:', error);
        });
    }

    // Start the quiz
    loadQuestion();
</script>

</body>
</html>
