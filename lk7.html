<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Grammar & Ideas Builder</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f0f4f8;
            --panel-bg: #ffffff;
            --text-main: #2d3748;
            --text-muted: #718096;
            --primary-color: #e10600; /* F1 Red */
            --secondary-color: #00d2be; /* Mercedes Teal */
            --border-color: #e2e8f0;
            --success-bg: #dcfce7;
            --success-text: #166534;
            --error-bg: #fee2e2;
            --error-text: #991b1b;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .panel {
            border: 3px solid var(--border-color);
            padding: 30px;
            max-width: 900px;
            width: 100%;
            background-color: var(--panel-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            position: relative;
        }

        h2 {
            text-align: center;
            color: var(--primary-color);
            margin-top: 0;
            font-size: 1.8rem;
            font-weight: 800;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .status {
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 30px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Layout for each zone */
        .zone-container {
            display: flex;
            gap: 20px;
            margin-bottom: 25px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            align-items: flex-start;
        }

        @media (max-width: 768px) {
            .zone-container {
                flex-direction: column;
            }
            .zone-image img {
                width: 100%;
                height: 180px;
            }
        }

        .zone-image {
            flex: 0 0 220px;
        }

        .zone-image img {
            width: 220px;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .zone-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .zone-title {
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--secondary-color);
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .sentence-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            width: 100%;
            box-sizing: border-box;
        }

        .sign {
            font-weight: 800;
            font-size: 1.2rem;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            color: white;
            flex-shrink: 0;
        }

        .sign.plus { background-color: #10b981; }
        .sign.minus { background-color: #ef4444; }

        select {
            background-color: #f8fafc;
            color: var(--text-main);
            border: 2px solid var(--border-color);
            padding: 8px 12px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s;
            font-size: 0.95rem;
            min-width: 100px;
        }

        /* Make the final judgment select stand out */
        select.judgment-select {
            min-width: 140px;
            border-width: 2px;
        }

        select:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(0, 210, 190, 0.2);
        }

        /* Highlights for correct/incorrect */
        select.correct-choice {
            border-color: #10b981;
            background-color: #ecfdf5;
            color: #047857;
        }

        select.wrong-choice {
            border-color: #ef4444;
            background-color: #fef2f2;
            color: #b91c1c;
        }

        .verify-btn {
            display: block;
            width: 100%;
            margin-top: 30px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            padding: 16px;
            font-family: inherit;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-radius: 10px;
            box-shadow: 0 4px 0 #b30500;
            transition: all 0.1s;
        }

        .verify-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #b30500;
        }

        .verify-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #b30500;
        }

        /* Final Screen Styles */
        #finalScreen {
            display: none;
            text-align: center;
            padding: 40px 20px;
            background: #fff;
            border-radius: 12px;
            border: 2px solid var(--border-color);
            margin-top: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .final-score {
            font-size: 3rem;
            font-weight: 800;
            color: var(--primary-color);
            margin: 20px 0;
        }

        .final-msg {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .restart-btn {
            background-color: var(--secondary-color);
            color: white;
            border: none;
            padding: 15px 40px;
            font-family: inherit;
            font-weight: 800;
            font-size: 1.1rem;
            cursor: pointer;
            border-radius: 10px;
            box-shadow: 0 4px 0 #009e8e;
            transition: all 0.1s;
        }

        .restart-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #009e8e;
        }

        #success-msg {
            display: none;
            color: #166534;
            font-weight: 800;
            font-size: 1.1rem;
            margin-top: 15px;
            background: #dcfce7;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #10b981;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="panel" id="quizPanel">
    <h2>F1: Brilliant vs Terrible Ideas</h2>
    <div class="status">Rules Analyzer Status: Grammar Sync</div>

    <div id="gameContent">
        <!-- ZONE 1: MECHANICS -->
        <div class="zone-container">
            <div class="zone-image">
                <img src="https://www.team-bhp.com/forum/attachments/motor-sports/1985410d1585471080-formula-1-beginners-guide-pitstop.jpg" alt="F1 Mechanics">
            </div>
            <div class="zone-content">
                <div class="zone-title">1. F1 Mechanics</div>
                <div class="sentence-row" data-zone="mechanics" data-type="plus">
                    <select class="p1">
                        <option value="">-- select --</option>
                        <option value="The">Many</option>
                        <option value="A">A</option>
                    </select>
                    <select class="p2">
                        <option value="">-- select --</option>
                        <option value="mechanics">mechanics</option>
                        <option value="drivers">drivers</option>
                    </select>
                    <select class="p3">
                        <option value="">-- select --</option>
                        <option value="don't">don't</option>
                        <option value="doesn't">doesn't</option>
                    </select>
                    <select class="p4">
                        <option value="">-- select --</option>
                        <option value="fix">fix</option>
                        <option value="fixes">fixes</option>
                    </select>
                    <select class="p5">
                        <option value="">-- select --</option>
                        <option value="old cars">old cars</option>
                        <option value="new cars">new cars</option>
                    </select>
                    <select class="p6">
                        <option value="">-- select --</option>
                        <option value="in the garage.">in the garage.</option>
                        <option value="at the track.">at the track.</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- ZONE 2: MAX -->
        <div class="zone-container">
            <div class="zone-image">
                <img src="https://i.ytimg.com/vi/UlChq-VKxdM/maxresdefault.jpg" alt="F1 Driver">
            </div>
            <div class="zone-content">
                <div class="zone-title">2. Driver Interviews</div>
                <div class="sentence-row" data-zone="max" data-type="plus">
                    <select class="p1">
                        <option value="">-- select --</option>
                        <option value="Max">Max</option>
                        <option value="Lewis">Lewis</option>
                    </select>
                    <select class="p2">
                        <option value="">-- select --</option>
                        <option value="likes">likes</option>
                        <option value="hates">hates</option>
                    </select>
                    <select class="p3">
                        <option value="">-- select --</option>
                        <option value="to tell stories">to tell stories</option>
                        <option value="to drive fast">to drive fast</option>
                    </select>
                    <select class="p4">
                        <option value="">-- select --</option>
                        <option value="when he has">when he have</option>
                        <option value="because he has">because he has</option>
                    </select>
                    <select class="p5">
                        <option value="">-- select --</option>
                        <option value="interviews">races</option>
                        <option value="meetings">interviews</option>
                    </select>
                    <select class="p6">
                        <option value="">-- select --</option>
                        <option value="with TV channels.">with TV channels.</option>
                        <option value="with his team.">with his team.</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- ZONE 3: IDEAS (UPDATED TO MULTI-SELECT WITH INSTANT FEEDBACK) -->
        <div class="zone-container">
            <div class="zone-image">
                <img src="https://i.ytimg.com/vi/M2nzFvkLwc4/maxresdefault.jpg" alt="F1 Uniform">
            </div>
            <div class="zone-content">
                <div class="zone-title">3. Brilliant vs Terrible</div>
                
                <!-- Row 1 -->
                <div class="sentence-row" data-zone="ideas" data-type="r1">
                    <span class="sign plus">+</span>
                    <select class="p1">
                        <option value="">-- freq --</option>
                        <option value="always">always</option>
                        <option value="never">never</option>
                    </select>
                    <select class="p2">
                        <option value="">-- action --</option>
                        <option value="eat vegetables">eat vegetables</option>
                        <option value="watch drama channel">watch drama channel</option>
                    </select>
                    <select class="p3 judgment-select">
                        <option value="">-- judgment --</option>
                        <option value="Brilliant idea">Brilliant idea</option>
                        <option value="Terrible idea">Terrible idea</option>
                    </select>
                </div>

                <!-- Row 2 -->
                <div class="sentence-row" data-zone="ideas" data-type="r2">
                    <span class="sign minus">-</span>
                    <select class="p1">
                        <option value="">-- freq --</option>
                        <option value="always">always</option>
                        <option value="rarely">sometimes</option>
                    </select>
                    <select class="p2">
                        <option value="">-- action --</option>
                        <option value="worry about driving">worry about driving</option>
                        <option value="practice driving">drive fast</option>
                    </select>
                    <select class="p3 judgment-select">
                        <option value="">-- judgment --</option>
                        <option value="Brilliant idea">Brilliant idea</option>
                        <option value="Terrible idea">Terrible idea</option>
                    </select>
                </div>

                <!-- Row 3 -->
                <div class="sentence-row" data-zone="ideas" data-type="r3">
                    <span class="sign minus">-</span>
                    <select class="p1">
                        <option value="">-- freq --</option>
                        <option value="never">never</option>
                        <option value="sometimes">sometimes</option>
                    </select>
                    <select class="p2">
                        <option value="">-- action --</option>
                        <option value="listen to sports news">listen to sports news</option>
                        <option value="ignore the engine">have interviews</option>
                    </select>
                    <select class="p3 judgment-select">
                        <option value="">-- judgment --</option>
                        <option value="Brilliant idea">Brilliant idea</option>
                        <option value="Terrible idea">Terrible idea</option>
                    </select>
                </div>

                <!-- Row 4 -->
                <div class="sentence-row" data-zone="ideas" data-type="r4">
                    <span class="sign minus">-</span>
                    <select class="p1">
                        <option value="">-- freq --</option>
                        <option value="always">never</option>
                        <option value="usually">usually</option>
                    </select>
                    <select class="p2">
                        <option value="">-- action --</option>
                        <option value="argue with mechanics">speak with mechanics</option>
                        <option value="check the tires">speak loud</option>
                    </select>
                    <select class="p3 judgment-select">
                        <option value="">-- judgment --</option>
                        <option value="Brilliant idea">Brilliant idea</option>
                        <option value="Terrible idea">Terrible idea</option>
                    </select>
                </div>

                <!-- Row 5 -->
                <div class="sentence-row" data-zone="ideas" data-type="r5">
                    <span class="sign plus">+</span>
                    <select class="p1">
                        <option value="">-- freq --</option>
                        <option value="always">always</option>
                        <option value="never">never</option>
                    </select>
                    <select class="p2">
                        <option value="">-- action --</option>
                        <option value="meet up your team">meet up your team</option>
                        <option value="skip training">stop training</option>
                    </select>
                    <select class="p3 judgment-select">
                        <option value="">-- judgment --</option>
                        <option value="Brilliant idea">Brilliant idea</option>
                        <option value="Terrible idea">Terrible idea</option>
                    </select>
                </div>
            </div>
        </div>

        <button class="verify-btn" id="verifyBtn">Verify Sentence Telemetry</button>
    </div>

    <!-- Final Screen -->
    <div id="finalScreen">
        <div class="final-score" id="finalScoreText">0 / 0</div>
        <div class="final-msg" id="finalMsg">Great job! You completed the quiz.</div>
        
        <p id="success-msg">Results sent successfully! ✅</p>
        
        <button class="restart-btn" onclick="location.reload()">Play Again</button>
    </div>
</div>

<script>
    // ======== MANDATORY TRACKING DATA ======
    const TEST_NAME = "F1 Grammar & Brilliant vs Terrible Ideas";
    let userMistakes = [];
    let isChecked = false;

    // Updated Correct Answers matching the new multi-select structure
    const correctAnswers = [
        { zone: "mechanics", type: "plus", p1: "The", p2: "mechanics", p3: "don't", p4: "fix", p5: "old cars", p6: "in the garage." },
        { zone: "max", type: "plus", p1: "Max", p2: "likes", p3: "to tell stories", p4: "when he has", p5: "meetings", p6: "with TV channels." },
        // Zone 3 updated answers (3 parts per row)
        { zone: "ideas", type: "r1", p1: "always", p2: "eat vegetables", p3: "Brilliant idea" },
        { zone: "ideas", type: "r2", p1: "rarely", p2: "worry about driving", p3: "Terrible idea" },
        { zone: "ideas", type: "r3", p1: "never", p2: "listen to sports news", p3: "Terrible idea" },
        { zone: "ideas", type: "r4", p1: "always", p2: "argue with mechanics", p3: "Terrible idea" },
        { zone: "ideas", type: "r5", p1: "always", p2: "meet up your team", p3: "Brilliant idea" }
    ];

    const verifyBtn = document.getElementById('verifyBtn');
    const allSelects = document.querySelectorAll('select');

    // ФУНКЦИЯ ПЕРЕМЕШИВАНИЯ ВАРИАНТОВ
    function shuffleSelectOptions(selectElement) {
        const options = Array.from(selectElement.options).filter(opt => opt.value !== "");
        // Fisher-Yates Shuffle
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }
        
        // Сохраняем placeholder (-- select --)
        const placeholder = selectElement.options[0];
        selectElement.innerHTML = "";
        selectElement.appendChild(placeholder);
        
        // Добавляем перемешанные варианты
        options.forEach(opt => selectElement.appendChild(opt));
    }

    // Применяем перемешивание ко всем выпадающим спискам при загрузке
    allSelects.forEach(select => {
        shuffleSelectOptions(select);
        
        // МГНОВЕННАЯ ПРОВЕРКА ПРИ ИЗМЕНЕНИИ ВЫБОРА
        select.addEventListener('change', function() {
            if (isChecked) return; // Не подсвечиваем после финальной проверки
            
            // Находим правильный ответ для этого селекта
            const row = this.closest('.sentence-row');
            const zone = row.dataset.zone;
            const type = row.dataset.type;
            const index = Array.from(row.querySelectorAll('select')).indexOf(this);
            const partKey = `p${index + 1}`;
            
            const answerObj = correctAnswers.find(a => a.zone === zone && a.type === type);
            if (answerObj && this.value) {
                if (this.value === answerObj[partKey]) {
                    this.classList.add('correct-choice');
                    this.classList.remove('wrong-choice');
                } else {
                    this.classList.add('wrong-choice');
                    this.classList.remove('correct-choice');
                }
            } else {
                this.classList.remove('correct-choice', 'wrong-choice');
            }
        });
    });

    // Проверка ответов по кнопке
    verifyBtn.addEventListener('click', () => {
        if (isChecked) return;
        
        let totalQuestions = allSelects.length;
        let score = 0;
        userMistakes = []; // Reset mistakes array

        // Сброс прошлых результатов
        allSelects.forEach(select => select.classList.remove('correct-choice', 'wrong-choice'));

        correctAnswers.forEach(ans => {
            const row = document.querySelector(`.sentence-row[data-zone="${ans.zone}"][data-type="${ans.type}"]`);
            const selects = row.querySelectorAll('select');

            selects.forEach((sel, index) => {
                const partKey = `p${index + 1}`;
                const correctValue = ans[partKey];

                if (sel.value === correctValue) {
                    score++;
                    sel.classList.add('correct-choice');
                } else {
                    sel.classList.add('wrong-choice');
                    if (sel.value) { // Track only actual selections
                        userMistakes.push(sel.value);
                    }
                }
            });
        });

        // Show Final Screen
        isChecked = true;
        document.getElementById('gameContent').classList.add('hidden');
        
        const finalScreen = document.getElementById('finalScreen');
        finalScreen.style.display = 'block';
        
        document.getElementById('finalScoreText').innerText = `${score} / ${totalQuestions}`;
        
        let msg = "Keep practicing!";
        if (score === totalQuestions) msg = "Perfect! You are an F1 Grammar Master! 🏆";
        else if (score >= totalQuestions * 0.7) msg = "Great job! You know your F1 rules! 🏎️";
        
        document.getElementById('finalMsg').innerText = msg;

        // Send results to Google
        sendResultsToGoogle(score, totalQuestions);
    });

    // ========== MANDATORY GOOGLE SHEETS SENDING FUNCTION ==========
    async function sendResultsToGoogle(score, total) {
        const url = "https://script.google.com/macros/s/AKfycbxZDFh5oa4GAU6RMvWX_OIh0GeLTbolr7P-6cCtbCNT5qiTShRaCYlETAxewsLsnooK/exec";
        
        const formData = new URLSearchParams();
        formData.append("name", TEST_NAME);
        formData.append("score", score);
        formData.append("total", total);
        formData.append("mistakes", userMistakes.join(', '));

        try {
            await fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: formData.toString()
            });
            
            // Display the required success message in green
            document.getElementById('success-msg').style.display = 'block';
        } catch (error) {
            console.error("Error sending results:", error);
        }
    }
</script>

</body>
</html>
