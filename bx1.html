<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vocabulary Categories · A1 Quiz</title>
<style>
    :root { --primary: #0984e3; --success: #00b894; --error: #d63031; --bg: #fdfdfd; }
    * { box-sizing: border-box; font-family: 'Comic Sans MS', 'Segoe UI', sans-serif; }
    body { background: var(--bg); display: flex; justify-content: center; padding: 20px; margin: 0; min-height: 100vh; }
    .quiz-container {
        background: white; width: 100%; max-width: 800px; padding: 30px;
        border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        text-align: center; border: 4px solid #eee; min-height: 600px;
    }
    .progress-header { font-weight: bold; color: #aaa; text-transform: uppercase; margin-bottom: 10px; font-size: 0.9rem; letter-spacing: 1px; }
    .q-title { font-size: 1.4rem; color: #2d3436; margin: 8px 0 12px; }
    .visual-box { font-size: 4.5rem; margin: 20px 0; display: flex; justify-content: center; gap: 20px; align-items: center; min-height: 140px; }

    .sentence-builder {
        border-bottom: 3px dashed #ddd; min-height: 80px; margin: 20px 0;
        display: flex; justify-content: center; align-items: center; gap: 10px;
        flex-wrap: wrap; padding: 10px;
    }
    .word-tag {
        background: var(--primary); color: white; padding: 12px 20px;
        border-radius: 12px; font-weight: bold; font-size: 1.3rem;
        animation: pop 0.3s;
    }
    @keyframes pop { 0% { transform: scale(0.8); } 100% { transform: scale(1); } }

    .btn-pool { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-top: 20px; }
    .action-btn {
        background: #fff; padding: 15px 25px; border: 2px solid #ddd;
        border-radius: 15px; cursor: pointer; font-weight: bold;
        font-size: 1.2rem; box-shadow: 0 4px 0 #ccc;
        transition: 0.15s; font-family: inherit; color: #2d3436;
    }
    .action-btn:hover { background: #eef7ff; border-color: var(--primary); }
    .action-btn:active { transform: translateY(3px); box-shadow: none; }
    .action-btn.hidden-btn { visibility: hidden; }

    .feedback { margin-top: 20px; font-size: 1.8rem; font-weight: bold; min-height: 50px; }

    @media (max-width: 520px) {
        .quiz-container { padding: 20px; }
        .q-title { font-size: 1.15rem; }
        .visual-box { font-size: 3.2rem; }
        .action-btn { font-size: 1rem; padding: 12px 16px; }
        .word-tag { font-size: 1.05rem; padding: 9px 14px; }
    }
    
    .status-msg {
        font-size: 1.1rem;
        font-weight: bold;
        margin-top: 15px;
        min-height: 20px;
    }
</style>
</head>
<body>

<div class="quiz-container">
    <div id="progress" class="progress-header">Loading...</div>
    <h2 id="q-title" class="q-title">Title</h2>
    <div id="visual-content" class="visual-box"></div>

    <div id="game-ui">
        <div class="sentence-builder" id="builder"></div>
        <div id="pool" class="btn-pool"></div>
    </div>

    <div class="feedback" id="feedback"></div>
</div>

<script>
    // ========== TRACKING DATA ==========
    const TEST_NAME = "Vocabulary Categorization (A1)";
    let userMistakes = [];
    let correctAnswers = 0;

    let currentStep = 0;
    let currentSentence = [];

    /* Adapted Data: 
       - Rule: Categorize the word into its correct group (Transport, Animal, Toy, Number).
       - Test basic article usage (a vs an).
    */
    const rawData = [
        { mode: 'words', title: "Category: bus", visual: "🚌", 
          items: ["It", "is", "a", "transport"], correct: "It is a transport" },
          
        { mode: 'words', title: "Category: lion", visual: "🦁", 
          items: ["It", "is", "an", "animal"], correct: "It is an animal" },
          
        { mode: 'words', title: "Category: kite", visual: "🪁", 
          items: ["It", "is", "a", "toy"], correct: "It is a toy" },
          
        { mode: 'words', title: "Category: sixty", visual: "6️⃣0️⃣", 
          items: ["It", "is", "a", "number"], correct: "It is a number" },
          
        { mode: 'words', title: "Category: train", visual: "🚆", 
          items: ["It", "is", "a", "transport"], correct: "It is a transport" },
          
        { mode: 'words', title: "Category: rabbit", visual: "🐰", 
          items: ["It", "is", "an", "animal"], correct: "It is an animal" },
          
        { mode: 'words', title: "Category: robot", visual: "🤖", 
          items: ["It", "is", "a", "toy"], correct: "It is a toy" },
          
        { mode: 'words', title: "Category: ninety", visual: "9️⃣0️⃣", 
          items: ["It", "is", "a", "number"], correct: "It is a number" },
          
        { mode: 'words', title: "Category: boat", visual: "🚤", 
          items: ["It", "is", "a", "transport"], correct: "It is a transport" },
          
        { mode: 'words', title: "Category: doll", visual: "🪆", 
          items: ["It", "is", "a", "toy"], correct: "It is a toy" }
    ];

    /* ── Normalize strings for comparison ── */
    function normalize(str) {
        return String(str)
            .toLowerCase()
            .replace(/[.,!?;:'"]/g, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    /* ── Fisher–Yates shuffle ── */
    function shuffle(arr) {
        const a = arr.slice();
        for (let i = a.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [a[i], a[j]] = [a[j], a[i]];
        }
        return a;
    }

    function loadGame() {
        const q = rawData[currentStep];
        if (!q) return;

        document.getElementById('progress').innerText =
            `Step ${currentStep + 1} of ${rawData.length}`;
        document.getElementById('q-title').innerText = q.title;
        document.getElementById('visual-content').innerHTML = q.visual;
        document.getElementById('feedback').innerText = "";

        const builder = document.getElementById('builder');
        const pool = document.getElementById('pool');
        builder.innerHTML = "";
        pool.innerHTML = "";
        currentSentence = [];

        /* Build tiles */
        const tiles = q.mode === 'letters'
            ? q.correct.split("")     
            : q.items;                

        const shuffledTiles = shuffle(tiles);

        shuffledTiles.forEach(tile => {
            const btn = document.createElement('button');
            btn.className = "action-btn";
            btn.innerText = tile;
            btn.dataset.tile = tile;
            btn.onclick = () => handleTileClick(btn, tile, q);
            pool.appendChild(btn);
        });

        builder.dataset.total = shuffledTiles.length;
    }

    function handleTileClick(btn, tile, q) {
        if (btn.classList.contains('hidden-btn')) return;

        btn.classList.add('hidden-btn');
        currentSentence.push(tile);

        const builder = document.getElementById('builder');
        builder.innerHTML += `<span class="word-tag">${tile}</span>`;

        const totalTiles = parseInt(builder.dataset.total, 10);

        if (currentSentence.length === totalTiles) {
            const userAnswer = q.mode === 'letters'
                ? currentSentence.join("")
                : currentSentence.join(" ");

            if (normalize(userAnswer) === normalize(q.correct)) {
                success();
            } else {
                fail(userAnswer);
            }
        }
    }

    function success() {
        document.getElementById('feedback').innerHTML =
            "<span style='color:var(--success)'>🌟 WELL DONE! 🌟</span>";
        correctAnswers++;
        setTimeout(() => {
            currentStep++;
            if (currentStep < rawData.length) {
                loadGame();
            } else {
                finish();
            }
        }, 1100);
    }

    function fail(userAnswer) {
        document.getElementById('feedback').innerHTML =
            "<span style='color:var(--error)'>❌ Try again!</span>";
        userMistakes.push(userAnswer); // Track the mistake
        setTimeout(() => {
            loadGame();
        }, 1200);
    }

    function finish() {
        document.getElementById('progress').innerText = "Complete!";
        document.getElementById('q-title').innerText = "Vocabulary Master!";
        document.getElementById('visual-content').innerHTML = "🏆";
        document.getElementById('game-ui').innerHTML =
            `<h3>Excellent! You know how to categorize words correctly!</h3>
             <p>Final Score: ${correctAnswers} / ${rawData.length}</p>
             <div id="send-status" class="status-msg"></div>`;
        document.getElementById('feedback').innerText = "";
        
        sendResultsToGoogle();
    }

    // ========== GOOGLE SHEETS SENDING FUNCTION ==========
    function sendResultsToGoogle() {
        const url = "https://script.google.com/macros/s/AKfycbxZDFh5oa4GAU6RMvWX_OIh0GeLTbolr7P-6cCtbCNT5qiTShRaCYlETAxewsLsnooK/exec";
        
        const formData = new URLSearchParams();
        formData.append("name", TEST_NAME);
        formData.append("score", correctAnswers);
        formData.append("total", rawData.length);
        formData.append("mistakes", userMistakes.join(', '));

        const statusEl = document.getElementById('send-status');
        statusEl.style.color = "#666";
        statusEl.innerText = "Sending telemetry...";

        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: formData.toString()
        })
        .then(() => {
            statusEl.style.color = '#00b894'; // Green
            statusEl.innerText = "Results sent successfully! ✅";
        })
        .catch((error) => {
            console.error("Error sending results:", error);
            statusEl.style.color = '#d63031'; // Red
            statusEl.innerText = "Failed to send results ❌.";
        });
    }

    loadGame();
</script>
</body>
</html>
