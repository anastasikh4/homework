<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blox Academy: Shopping Dialogue</title>
    <style>
        :root {
            --rbx-blue: #00a2ff;
            --rbx-green: #00e676;
            --rbx-red: #ff5252;
            --rbx-dark: #393b3d;
            --rbx-bg: #63b3ff;
            --rbx-silver: #bdc3c7;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial Black', sans-serif;
            background-color: var(--rbx-bg);
            background-image: radial-gradient(#ffffff 15%, transparent 15%);
            background-size: 40px 40px;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            align-items: center;
        }

        .game-wrapper {
            max-width: 750px;
            width: 100%;
            background: white;
            border-radius: 15px;
            border-bottom: 8px solid var(--rbx-silver);
            padding: 25px;
            position: relative;
            text-align: center;
            animation: zoomIn 0.4s ease-out;
        }

        @keyframes zoomIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .hud {
            display: flex;
            justify-content: space-between;
            background: var(--rbx-dark);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            flex-wrap: wrap;
            gap: 8px;
        }
        .hud span { display: flex; align-items: center; gap: 6px; }

        .word-bank {
            background: #f0f4f8;
            border: 2px dashed var(--rbx-blue);
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            font-size: 1.1rem;
            color: var(--rbx-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: bold;
        }
        .word-bank span {
            display: inline-block;
            background: white;
            padding: 4px 10px;
            margin: 3px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        .img-box {
            width: 280px;
            height: 200px;
            margin: 15px auto;
            border-radius: 12px;
            border: 5px solid var(--rbx-silver);
            background: #f0f4f8;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            transition: 0.3s;
        }
        .img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .img-box.correct-flash { border-color: var(--rbx-green); }
        .img-box.wrong-flash { border-color: var(--rbx-red); }

        .question-text {
            font-size: 1.3rem;
            color: #333;
            margin: 12px 0 8px;
            line-height: 1.6;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 4px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-weight: 600;
            text-align: center;
        }
        .question-text .blank {
            display: inline-block;
            min-width: 100px;
            border-bottom: 4px solid var(--rbx-blue);
            padding: 0 10px;
            color: var(--rbx-blue);
            font-weight: 900;
            background: #e3f2fd;
            border-radius: 4px 4px 0 0;
            font-family: 'Arial Black', sans-serif;
        }
        .question-text .blank.filled-correct {
            border-bottom-color: var(--rbx-green);
            color: var(--rbx-green);
            background: #e8f5e9;
        }

        .feedback {
            font-size: 24px;
            height: 44px;
            margin: 10px 0;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .feedback.correct { color: var(--rbx-green); }
        .feedback.wrong { color: var(--rbx-red); }

        .btn-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 10px;
        }
        .btn-grid button {
            padding: 18px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            background: var(--rbx-blue);
            color: white;
            border-bottom: 5px solid #0076bb;
            transition: 0.1s;
            font-family: 'Arial Black', sans-serif;
        }
        .btn-grid button:hover:not(:disabled) { background: #33b5ff; transform: scale(1.02); }
        .btn-grid button:active:not(:disabled) { transform: translateY(3px); border-bottom-width: 2px; }
        .btn-grid button:disabled { opacity: 0.6; cursor: default; transform: none; }
        .btn-grid button.correct-btn { background: var(--rbx-green); border-bottom-color: #00a354; }
        .btn-grid button.wrong-btn { background: var(--rbx-red); border-bottom-color: #b33939; }

        .progress-bar {
            width: 100%;
            height: 10px;
            background: #eee;
            border-radius: 10px;
            margin-top: 22px;
            overflow: hidden;
            border: 2px solid #ddd;
        }
        .progress-fill {
            height: 100%;
            background: var(--rbx-green);
            width: 0%;
            transition: 0.4s;
        }

        #win-screen {
            display: none;
            animation: zoomIn 0.5s ease-out;
            padding: 20px 0;
        }
        #win-screen h2 {
            font-size: 36px;
            color: var(--rbx-green);
            margin-bottom: 6px;
        }
        #win-screen .trophy { font-size: 72px; }
        #win-screen .final-score {
            font-size: 24px;
            color: var(--rbx-dark);
            background: #f5f5f5;
            padding: 8px 30px;
            border-radius: 40px;
            display: inline-block;
            margin: 12px 0 20px;
        }
        #win-screen button {
            padding: 16px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            border-radius: 10px;
            border: none;
            background: var(--rbx-green);
            color: white;
            border-bottom: 5px solid #00a354;
            font-family: 'Arial Black', sans-serif;
            transition: 0.1s;
        }
        #win-screen button:hover { transform: scale(1.03); }
        #win-screen button:active { transform: translateY(3px); border-bottom-width: 2px; }

        .particle {
            position: absolute;
            pointer-events: none;
            width: 14px;
            height: 14px;
            border-radius: 3px;
            animation: shoot 0.8s ease-out forwards;
            z-index: 100;
        }
        @keyframes shoot {
            0% { transform: translate(0,0) rotate(0deg) scale(1); opacity: 1; }
            100% { transform: translate(var(--x), var(--y)) rotate(400deg) scale(0.4); opacity: 0; }
        }

        @media (max-width: 520px) {
            .game-wrapper { padding: 16px; }
            .question-text { font-size: 1.1rem; min-height: 80px; }
            .img-box { width: 200px; height: 150px; }
            .btn-grid button { font-size: 0.95rem; padding: 14px; }
            .hud { font-size: 0.9rem; padding: 10px 14px; }
            .feedback { font-size: 20px; height: 36px; }
            #win-screen h2 { font-size: 30px; }
            .word-bank { font-size: 1rem; }
        }
        @media (max-width: 400px) {
            .question-text { font-size: 1rem; }
            .btn-grid { grid-template-columns: 1fr; gap: 10px; }
            .img-box { width: 160px; height: 120px; }
        }
    </style>
</head>
<body>

<div class="game-wrapper" id="stage">
    <h1 style="color: #333; margin-top:0; font-size: 1.5rem;">🛍️ BLOX ACADEMY: SHOPPING</h1>
    <div class="hud">
        <span>🎯 STAGE: <span id="q-num">1</span>/10</span>
        <span>⭐ SCORE: <span id="score">0</span></span>
    </div>

    <!-- WORD BANK -->
    <div class="word-bank">
        <strong>Word Bank:</strong> 
        <span>this</span> <span>flowers</span> <span>birthday</span> <span>look</span> <span>present</span> <span>have</span> <span>has</span>
    </div>

    <div id="game-content">
        <div class="question-text" id="question-text">Loading...</div>
        <div class="img-box" id="img-box"></div>
        <div class="feedback" id="feedback"></div>
        <div class="btn-grid" id="options"></div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    </div>

    <div id="win-screen">
        <div class="trophy">🏆</div>
        <h2>GG! MISSION COMPLETE!</h2>
        <p style="font-size: 1.1rem; color: #555;">You completed the shopping dialogue!</p>
        <div class="final-score">⭐ <span id="final-score">0</span> / 10</div>
        <div id="send-status" style="font-weight: bold; font-size: 1.1rem; margin-top: 10px; min-height: 20px;"></div>
        <br>
        <button onclick="location.reload()">🔄 PLAY AGAIN</button>
    </div>
</div>

<script>
    // ================================================================
    // CONFIGURATION & TRACKING
    // ================================================================
    const TEST_NAME = "Shopping Dialogue (Extended 10 Questions)";
    let userMistakes = [];
    let correctAnswers = 0;

    // ================================================================
    // DATA (Adapted from the image + 5 new questions)
    // ================================================================
    const missionData = [
        {
            q: 'Boy: Hello! I want to buy a <span class="blank" id="blank1">______</span> for my sister.',
            img: 'https://static.vecteezy.com/system/resources/thumbnails/048/948/672/small_2x/christmas-present-gift-box-with-red-ribbon-png.png',
            options: ['present', 'flowers', 'has'],
            ans: 'present'
        },
        {
            q: 'Assistant: <span class="blank" id="blank1">______</span> at this beautiful teddy bear! It\'s cool!',
            img: 'https://avatars.mds.yandex.net/i?id=520fcc293be5938a57995ee0129128dc_l-5127171-images-thumbs&n=13',
            options: ['Look', 'Have', 'Has'],
            ans: 'Look'
        },
        {
            q: 'Boy: My sister is a girl. Can I <span class="blank" id="blank1">______</span> this nice doll?',
            img: 'https://thumbs.dreamstime.com/b/little-cute-girl-looks-admiration-handmade-dolls-shop-window-273997983.jpg',
            options: ['have', 'has', 'look'],
            ans: 'have'
        },
        {
            q: 'Assistant: Sure. It\'s a good present for a girl.<br>Boy: I like it. I want <span class="blank" id="blank1">______</span> doll for my sister.',
            img: 'https://avatars.mds.yandex.net/get-shedevrum/13067546/img_ba3a01c5836211efa0e3262f19582f8a/orig',
            options: ['this', 'that', 'these'],
            ans: 'this'
        },
        {
            q: 'Boy: I want this doll for my sister\'s <span class="blank" id="blank1">______</span>.',
            img: 'https://i.pinimg.com/originals/a5/42/16/a54216206e63bae929f447ac0c9bd0a0.jpg?nii=t',
            options: ['birthday', 'present', 'flowers'],
            ans: 'birthday'
        },
        // --- 5 NEW QUESTIONS USING THE SAME PICTURES ---
        {
            q: 'Boy: Does your shop <span class="blank" id="blank1">______</span> this beautiful doll?',
            img: 'https://thumbs.dreamstime.com/b/little-cute-girl-looks-admiration-handmade-dolls-shop-window-273997983.jpg',
            options: ['have', 'has', 'look'],
            ans: 'have'
        },
        {
            q: 'Assistant: Yes, and she <span class="blank" id="blank1">______</span> many other toys.',
            img: 'https://avatars.mds.yandex.net/get-shedevrum/13067546/img_ba3a01c5836211efa0e3262f19582f8a/orig',
            options: ['has', 'have', 'look'],
            ans: 'has'
        },
        {
            q: 'Boy: Let\'s <span class="blank" id="blank1">______</span> at this beautiful teddy bear.',
            img: 'https://avatars.mds.yandex.net/i?id=520fcc293be5938a57995ee0129128dc_l-5127171-images-thumbs&n=13',
            options: ['look', 'have', 'has'],
            ans: 'look'
        },
        {
            q: 'Boy: I will buy this <span class="blank" id="blank1">______</span> for her.',
            img: 'https://static.vecteezy.com/system/resources/thumbnails/048/948/672/small_2x/christmas-present-gift-box-with-red-ribbon-png.png',
            options: ['present', 'flowers', 'look'],
            ans: 'present'
        },
        {
            q: 'Boy: I don\'t need <span class="blank" id="blank1">______</span>, she likes toys more.',
            img: 'https://img.magnific.com/free-photo/lavender-colored-background-with-flower-texture_23-2151396629.jpg?semt=ais_hybrid',
            options: ['flowers', 'present', 'has'],
            ans: 'flowers'
        }
    ];

    // ================================================================
    // GAME ENGINE
    // ================================================================
    let currentIdx = 0;
    let isAnswered = false;

    const qNum = document.getElementById('q-num');
    const scoreDisplay = document.getElementById('score');
    const questionText = document.getElementById('question-text');
    const imgBox = document.getElementById('img-box');
    const feedback = document.getElementById('feedback');
    const optionsBox = document.getElementById('options');
    const progressFill = document.getElementById('progress-fill');
    const finalScore = document.getElementById('final-score');
    const gameContent = document.getElementById('game-content');
    const winScreen = document.getElementById('win-screen');

    function launchParticles() {
        const stage = document.getElementById('stage');
        const colors = ['#00a2ff', '#00e676', '#ff5252', '#fdd835', '#9c27b0', '#ff6f00'];
        for (let i = 0; i < 22; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.background = colors[Math.floor(Math.random() * colors.length)];
            p.style.left = '50%';
            p.style.top = '45%';
            p.style.setProperty('--x', (Math.random() - 0.5) * 500 + 'px');
            p.style.setProperty('--y', (Math.random() - 0.5) * 500 + 'px');
            stage.appendChild(p);
            setTimeout(() => p.remove(), 800);
        }
    }

    function loadQuestion() {
        const data = missionData[currentIdx];
        if (!data) { showWin(); return; }

        isAnswered = false;
        qNum.textContent = currentIdx + 1;
        scoreDisplay.textContent = correctAnswers;
        questionText.innerHTML = data.q;

        if (data.img) {
            imgBox.innerHTML = `<img src="${data.img}" alt="picture">`;
        } else {
            imgBox.innerHTML = `<span style="font-size:80px; color:#999;">🖼️</span>`;
        }
        imgBox.className = 'img-box';

        feedback.textContent = '';
        feedback.className = 'feedback';

        const shuffled = [...data.options].sort(() => Math.random() - 0.5);
        optionsBox.innerHTML = '';
        shuffled.forEach(opt => {
            const btn = document.createElement('button');
            btn.textContent = opt;
            btn.addEventListener('click', () => handleAnswer(opt, btn, data));
            optionsBox.appendChild(btn);
        });

        const pct = Math.round((currentIdx / missionData.length) * 100);
        progressFill.style.width = pct + '%';
    }

    function handleAnswer(choice, btn, data) {
        if (isAnswered) return;
        isAnswered = true;

        const allBtns = document.querySelectorAll('#options button');
        allBtns.forEach(b => b.disabled = true);

        const isCorrect = choice === data.ans;

        if (isCorrect) {
            btn.classList.add('correct-btn');
            imgBox.classList.add('correct-flash');
            feedback.textContent = '✅ CLEARED!';
            feedback.className = 'feedback correct';
            correctAnswers++;
            scoreDisplay.textContent = correctAnswers;
            launchParticles();

            const blank = document.querySelector('.blank');
            if (blank) {
                blank.textContent = choice;
                blank.classList.add('filled-correct');
            }

            setTimeout(() => {
                currentIdx++;
                loadQuestion();
            }, 1000);

        } else {
            btn.classList.add('wrong-btn');
            imgBox.classList.add('wrong-flash');
            feedback.textContent = '❌ OOF! TRY AGAIN';
            feedback.className = 'feedback wrong';
            
            // Track mistake
            userMistakes.push(choice);

            allBtns.forEach(b => {
                if (b.textContent === data.ans) {
                    b.classList.add('correct-btn');
                }
            });

            setTimeout(() => {
                imgBox.className = 'img-box';
                feedback.className = 'feedback';
                allBtns.forEach(b => {
                    b.disabled = false;
                    b.classList.remove('correct-btn', 'wrong-btn');
                });
                isAnswered = false;
            }, 1500);
        }
    }

    function showWin() {
        gameContent.style.display = 'none';
        winScreen.style.display = 'block';
        finalScore.textContent = correctAnswers;
        progressFill.style.width = '100%';
        launchParticles();
        setTimeout(launchParticles, 400);
        setTimeout(launchParticles, 800);
        
        sendResultsToGoogle();
    }

    // ================================================================
    // GOOGLE SHEETS INTEGRATION (MANDATORY)
    // ================================================================
    function sendResultsToGoogle() {
        const url = "https://script.google.com/macros/s/AKfycbxZDFh5oa4GAU6RMvWX_OIh0GeLTbolr7P-6cCtbCNT5qiTShRaCYlETAxewsLsnooK/exec";
        
        const formData = new URLSearchParams();
        formData.append("name", TEST_NAME);
        formData.append("score", correctAnswers);
        formData.append("total", missionData.length);
        formData.append("mistakes", userMistakes.join(', '));

        const statusEl = document.getElementById('send-status');
        statusEl.style.color = "#666";
        statusEl.innerText = "Sending results...";

        fetch(url, {
            method: 'POST',
            mode: 'no-cors',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: formData.toString()
        })
        .then(() => {
            statusEl.style.color = '#00e676'; // Green
            statusEl.innerText = "Results sent successfully! ✅";
        })
        .catch((error) => {
            console.error("Error sending results:", error);
            statusEl.style.color = '#ff5252'; // Red
            statusEl.innerText = "Failed to send results ❌.";
        });
    }

    loadQuestion();
</script>

</body>
</html>
